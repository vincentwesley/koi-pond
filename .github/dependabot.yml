version: 2
# Monthly + grouped keeps PR noise low; GitHub security updates are separate and still arrive immediately.
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    ignore:
      # Hold majors that break the toolchain: typescript-eslint lags new TypeScript majors, @types/node must match the pinned Node.
      - { dependency-name: typescript, update-types: ["version-update:semver-major"] }
      - { dependency-name: "@types/node", update-types: ["version-update:semver-major"] }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
